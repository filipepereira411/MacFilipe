<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Service Kiosk (Sincronizado)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .kiosk-screen { width: 450px; height: 850px; background-color: #fff; color: #333; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; position: relative; overflow: hidden; border: 8px solid #2d2d2d; }
        .header { background-color: #264c33; color: #ffbc0d; padding: 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .main-content { display: flex; flex: 1; height: calc(100% - 180px); }
        .sidebar { width: 110px; background-color: #f8f9fa; border-right: 1px solid #e9ecef; display: flex; flex-direction: column; gap: 5px; padding-top: 10px; }
        .category-btn { background: none; border: none; padding: 15px 5px; font-size: 0.85rem; font-weight: 600; color: #6c757d; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .category-btn.active { color: #264c33; background-color: #fff; border-left: 4px solid #ffbc0d; }
        .category-icon { font-size: 1.5rem; }
        .products-grid { flex: 1; padding: 15px; grid-template-columns: repeat(2, 1fr); gap: 12px; overflow-y: auto; display: none; }
        .products-grid.active { display: grid; }
        .product-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.1s; }
        .product-card:active { transform: scale(0.95); background-color: #f8f9fa; }
        .product-img { font-size: 3rem; margin-bottom: 10px; }
        .product-name { font-size: 0.9rem; font-weight: 600; color: #333; }
        .product-price { font-size: 0.95rem; font-weight: bold; color: #264c33; margin-top: 5px; }
        .cart-bar { height: 90px; background-color: #fff; border-top: 2px solid #e9ecef; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: absolute; bottom: 0; width: 100%; }
        .cart-total { font-size: 1.3rem; font-weight: bold; }
        .checkout-btn { background-color: #ffbc0d; color: #264c33; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .payment-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #264c33; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; transform: translateY(100%); transition: transform 0.4s ease; z-index: 10; }
        .payment-overlay.active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="kiosk-screen">
        <div class="header">🍔 QUIOSQUE REAL-TIME 🍟</div>

        <div class="main-content">
            <!-- Barra Lateral -->
            <div class="sidebar">
                <button class="category-btn active" onclick="switchCategory('burgers', this)">
                    <span class="category-icon">🍔</span><span>Burgers</span>
                </button>
                <button class="category-btn" onclick="switchCategory('sides', this)">
                    <span class="category-icon">🍟</span><span>Acompanh.</span>
                </button>
                <button class="category-btn" onclick="switchCategory('drinks', this)">
                    <span class="category-icon">🥤</span><span>Bebidas</span>
                </button>
                <button class="category-btn" onclick="switchCategory('desserts', this)">
                    <span class="category-icon">🍦</span><span>Sobremesas</span>
                </button>
            </div>

            <!-- Grelhas de Produtos Dinâmicas -->
            <div id="burgers" class="products-grid active"></div>
            <div id="sides" class="products-grid"></div>
            <div id="drinks" class="products-grid"></div>
            <div id="desserts" class="products-grid"></div>
        </div>

        <!-- Carrinho -->
        <div class="cart-bar">
            <div class="cart-info">
                <div id="cart-count" style="color: #6c757d; font-size: 0.9rem;">0 artigos</div>
                <div id="cart-total" class="cart-total">0,00 €</div>
            </div>
            <button class="checkout-btn" onclick="openPayment()">Pedir ➔</button>
        </div>

        <!-- Ecrã de Pagamento -->
        <div id="payment-overlay" class="payment-overlay">
            <div style="font-size: 4rem;">💳</div>
            <h2>Aguardando Pagamento</h2>
            <p>Aproxime o cartão do terminal</p>
            <h1 id="payment-amount">0,00 €</h1>
            <button onclick="closePayment()" style="background: none; border: 2px solid white; color: white; padding: 10px 20px; border-radius: 20px; margin-top: 20px; cursor: pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        let cart = [];
        let totalAmount = 0;
        let currentCategory = 'burgers';

        // Carrega os dados da "Base de Dados" (localStorage) e reconstrói o menu
        function loadMenuFromDB() {
            const menuData = localStorage.getItem('kiosk_menu');
            if (!menuData) return;

            const products = JSON.parse(menuData);
            
            // Limpar todas as grelhas antes de recarregar
            document.querySelectorAll('.products-grid').forEach(grid => grid.innerHTML = '');

            // Inserir os produtos na grelha correspondente
            products.forEach(product => {
                const grid = document.getElementById(product.category);
                if (grid) {
                    grid.innerHTML += `
                        <div class="product-card" onclick="addToCart('${product.name}', ${product.price})">
                            <div class="product-img">${product.icon}</div>
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price.toFixed(2).replace('.', ',')} €</div>
                        </div>
                    `;
                }
            });
        }

        function switchCategory(categoryId, button) {
            currentCategory = categoryId;
            document.querySelectorAll('.products-grid').forEach(grid => grid.classList.remove('active'));
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(categoryId).classList.add('active');
            button.classList.add('active');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            totalAmount += price;
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = `${cart.length} artigo(s)`;
            document.getElementById('cart-total').innerText = `${totalAmount.toFixed(2).replace('.', ',')} €`;
        }

        function openPayment() {
            if (cart.length === 0) return alert('Carrinho vazio!');
            document.getElementById('payment-amount').innerText = `${totalAmount.toFixed(2).replace('.', ',')} €`;
            document.getElementById('payment-overlay').classList.add('active');
            
            setTimeout(() => {
                if(document.getElementById('payment-overlay').classList.contains('active')) {
                    alert('Pedido enviado com sucesso!');
                    cart = []; totalAmount = 0; updateCartUI(); closePayment();
                }
            }, 3000);
        }

        function closePayment() { document.getElementById('payment-overlay').classList.remove('active'); }

        // Escuta em tempo real se a outra aba (base de dados) alterou alguma coisa
        window.addEventListener('storage', (e) => {
            if (e.key === 'kiosk_update_trigger') {
                loadMenuFromDB();
            }
        });

        // Inicializar o menu ao abrir
        loadMenuFromDB();
    </script>
</body>
</html>
