<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's - Kiosk de Pedidos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333; }
        header { background-color: #da291c; color: #ffbc0d; padding: 15px; text-align: center; border-radius: 8px; }
        .menu-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .item-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ffbc0d; position: relative; }
        .item-card.esgotado { border-left-color: #777; opacity: 0.6; }
        .item-card h2 { margin-top: 0; color: #da291c; }
        .item-card.esgotado h2 { color: #555; }
        button { background-color: #ffbc0d; border: none; color: #333; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background-color: #e5a700; }
        button:disabled { background-color: #ccc; color: #777; cursor: not-allowed; }
        .cart-section { background: white; margin-top: 30px; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .send-btn { background-color: #da291c; color: white; margin-top: 15px; font-size: 16px; }
        .send-btn:hover { background-color: #b81d13; }
        .badge-esgotado { position: absolute; top: 15px; right: 15px; background: #da291c; color: white; padding: 2px 8px; font-size: 12px; font-weight: bold; border-radius: 3px; }
    </style>
</head>
<body>

<header>
    <h1>McDonald's Kiosk</h1>
    <p>Faça o seu pedido aqui</p>
</header>

<div class="menu-container" id="menu-container">
    <!-- Os produtos vão ser carregados dinamicamente aqui -->
</div>

<div class="cart-section">
    <h3>Carrinho: <span id="cart-count">0</span> itens</h3>
    <ul id="cart-list"></ul>
    <button class="send-btn" onclick="enviarParaCozinha()">Enviar para a Cozinha</button>
</div>

<script>
    let carrinho = [];

    // Base de dados padrão caso a cozinha ainda não tenha configurado nada
    const produtosPadrao = [
        { id: "bigmac", nome: "Big Mac", icon: "🍔", desc: "Dois hambúrgueres de carne de vaca, alface, queijo, pepino, cebola e o molho secreto.", disponivel: true },
        { id: "mcchicken", nome: "McChicken", icon: "🍗", desc: "Frango panado crocante com alface picada e delicioso molho de maionese.", disponivel: true },
        { id: "batatas", nome: "Batatas Fritas", icon: "🍟", desc: "As nossas famosas batatas fritas, douradas e estaladiças por fora.", disponivel: true },
        { id: "sundae", nome: "Sundae Chocolate", icon: "🍦", desc: "Gelado de baunilha cremoso coberto com uma luxuosa calda quente de chocolate.", disponivel: true }
    ];

    function carregarMenu() {
        // Tenta obter os produtos da cozinha ou usa os padrão
        let produtos = JSON.parse(localStorage.getItem('produtosMac')) || produtosPadrao;
        
        // Garante que o estado inicial fica guardado se for a primeira vez
        if(!localStorage.getItem('produtosMac')) {
            localStorage.setItem('produtosMac', JSON.stringify(produtosPadrao));
        }

        const container = document.getElementById('menu-container');
        container.innerHTML = '';

        produtos.forEach(prod => {
            const card = document.createElement('div');
            card.className = `item-card ${!prod.disponivel ? 'esgotado' : ''}`;
            
            card.innerHTML = `
                ${!prod.disponivel ? '<span class="badge-esgotado">Esgotado</span>' : ''}
                <h2>${prod.icon} ${prod.nome}</h2>
                <p>${prod.desc}</p>
                <button ${!prod.disponivel ? 'disabled' : ''} onclick="adicionarAoCarrinho('${prod.nome}')">
                    ${prod.disponivel ? 'Adicionar' : 'Indisponível'}
                </button>
            `;
            container.appendChild(card);
        });
    }

    function adicionarAoCarrinho(nome) {
        carrinho.push(nome);
        atualizarCarrinhoInterface();
    }

    function atualizarCarrinhoInterface() {
        document.getElementById('cart-count').innerText = carrinho.length;
        const lista = document.getElementById('cart-list');
        lista.innerHTML = '';
        carrinho.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            lista.appendChild(li);
        });
    }

    function enviarParaCozinha() {
        if (carrinho.length === 0) {
            alert('O seu carrinho está vazio!');
            return;
        }
        
        let pedidos = JSON.parse(localStorage.getItem('pedidosMac')) || [];
        const novoPedido = {
            id: Math.floor(Math.random() * 900) + 100,
            itens: [...carrinho],
            hora: new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })
        };
        
        pedidos.push(novoPedido);
        localStorage.setItem('pedidosMac', JSON.stringify(pedidos));
        
        alert(`Pedido #${novoPedido.id} enviado!`);
        carrinho = [];
        atualizarCarrinhoInterface();
    }

    // Atualiza o menu a cada 2 segundos para o caso de a cozinha desativar um produto
    setInterval(carregarMenu, 2000);
    window.onload = carregarMenu;
</script>

</body>
</html>
