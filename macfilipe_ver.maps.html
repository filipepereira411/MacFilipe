<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacFilipe</title>
<style>
:root{color-scheme:light;--bg:#fff6dc;--card:#fffdf6;--ink:#2b1a14;--mute:#7a6558;--red:#d62718;--yel:#ffc72c;--line:#ecd9a8;--ok:#1c8a4a;--top:#d62718;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:130px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:10}
header{background:var(--top);color:#fff;padding:14px 20px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.logo b{font-size:1.9rem;letter-spacing:-.5px;color:var(--yel);font-family:Georgia,"Times New Roman",serif;font-style:italic}
.logo span{font-size:.9rem;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;max-width:170px;white-space:nowrap;border:0;background:rgba(0,0,0,.18);color:#fff;font:inherit;font-weight:700;padding:10px 8px;border-radius:10px 10px 0 0;cursor:pointer}
nav button[aria-selected="true"]{background:var(--bg);color:var(--red)}
nav button:focus-visible,.btn:focus-visible,.cat:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:20px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.cat{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--yel);border-color:var(--yel);color:#2b1a14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:center}
.item .e{font-size:3.2rem;line-height:1.1}
.item h3{margin:0;font-size:1.1rem}
.item p{margin:0;font-size:.85rem;color:var(--mute);min-height:2.6em}
.item .pr{font-weight:800;color:var(--red);font-size:1.15rem}
.btn{border:0;background:var(--yel);color:#2b1a14;font:inherit;font-weight:800;padding:11px 18px;border-radius:999px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.cart{position:fixed;left:0;right:0;bottom:0;background:#2b1a14;color:#fff1d6;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.cart-in{max-width:1000px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between}
.lines{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 6px 4px 12px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:rgba(255,255,255,.2);color:inherit;width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:800}
.tot{font-size:1.25rem;font-weight:800;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:50px 0;font-size:1.2rem;grid-column:1/-1}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tk{background:var(--card);border:3px solid var(--yel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tk.late{border-color:var(--red)}
.tk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:8px}
.tk-h b{font-size:1.4rem;color:var(--red)}
.tk-h span{color:var(--mute);font-size:.9rem}
.tk ul{list-style:none;margin:0;padding:0;flex:1}
.tk li{padding:5px 0;font-size:1.1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols h2{margin:0 0 12px;font-size:1.3rem}
.nums{display:flex;flex-wrap:wrap;gap:10px}
.num{font-size:2.4rem;font-weight:900;border-radius:14px;padding:6px 18px;background:var(--card);border:3px solid var(--line);font-variant-numeric:tabular-nums}
.num.rdy{background:var(--ok);border-color:var(--ok);color:#fff;cursor:pointer;font-family:inherit}
.hint{color:var(--mute);font-size:.85rem;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 24px;border-radius:14px;font-weight:800;font-size:1.1rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.item.out{opacity:.55}.item.out .pr{color:var(--mute)}
.acc{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.9rem}.acc .btn{padding:6px 14px}
.fld{width:100%;font:inherit;font-size:1.05rem;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:0 0 8px}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.btn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.ovl.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:440px;text-align:center;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 6px;color:var(--red)}
.pays{display:flex;gap:12px;margin:16px 0}
.pay{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;border-radius:12px;padding:14px;cursor:pointer}
.pay span{display:block;font-size:1.8rem}
.pay[aria-pressed="true"]{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.flow{display:none;margin:12px 0;padding:14px;border:2px dashed var(--line);border-radius:12px}
.flow input{width:100%;font:inherit;font-size:1.1rem;text-align:center;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.stat{font-weight:700;margin-top:8px}
.kwrap{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.stock{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px}
.stock h2{margin:0 0 8px;font-size:1.1rem}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;font-size:.95rem}
.sw input{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}

/* Contentor do Mapa */
.map-box {
  width: 100%;
  height: 180px;
  border: 2px solid var(--line);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}

@media(max-width:700px){.kwrap{grid-template-columns:1fr}}
@media(max-width:560px){.cols{grid-template-columns:1fr}.cart-in{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>MacFilipe</b><span>Pedidos em tempo real</span><div class="acc" id="acc"></div></div>
  <nav role="tablist">
    <button role="tab" id="t-kiosk" onclick="go('kiosk')">Quiosque</button>
    <button role="tab" id="t-cozinha" onclick="go('cozinha')">Cozinha</button>
    <button role="tab" id="t-balcao" onclick="go('balcao')">Balcão</button>
    <button role="tab" id="t-conta" onclick="go('conta')">A minha conta</button>
    <button role="tab" id="t-admin" onclick="go('admin')">Admin</button>
  </nav>
</header>
<main id="app"></main>
<div class="cart" id="cart"></div>

<div class="ovl" id="pay"><div class="modal" role="dialog" aria-label="Pagamento"><h2>Pagamento</h2><p><b>Como quer receber?</b></p>
<div class="pays"><button class="pay" id="e-aqui" aria-pressed="true" onclick="modo('aqui')">Comer aqui</button><button class="pay" id="e-levar" aria-pressed="false" onclick="modo('levar')">Para levar</button><button class="pay" id="e-ent" aria-pressed="false" onclick="modo('ent')">Entrega</button></div>

<div id="f-ent" style="display:none">
  <!-- Google Maps da Estrada dos Luízes 17 -->
  <div class="map-box">
    <iframe src="https://google.com" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <input class="fld" id="en-mor" placeholder="Morada (rua, n.º, andar)" autocomplete="street-address" value="Estrada dos Luízes, n.º 17">
  <input class="fld" id="en-cp" placeholder="Código postal (0000-000)" maxlength="8" inputmode="numeric" autocomplete="postal-code" value="2070-388">
  <input class="fld" id="en-tel" type="tel" placeholder="Telemóvel para contacto" maxlength="9" autocomplete="tel">
  <p class="err" id="en-e" role="alert"></p>
</div>

<p class="stat" id="resumo"></p>
<p>Escolha como quer pagar.</p>
<div class="pays"><button class="pay" id="b-card" aria-pressed="false" onclick="pick('card')"><span>💳</span>Cartão / MB</button><button class="pay" id="b-mb" aria-pressed="false" onclick="pick('mb')"><span>📱</span>MB WAY</button></div>
