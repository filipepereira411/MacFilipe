<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's - Ecrã da Cozinha</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
        }

        header {
            background-color: #bd0017;
            color: #ffbc0d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 1.8em;
        }

        .painel-pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .pedido-card {
            background-color: #222;
            border: 2px solid #ffbc0d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .pedido-id {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffbc0d;
        }

        .pedido-hora {
            color: #aaa;
            font-size: 0.9em;
        }

        .pedido-itens {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            flex-grow: 1;
        }

        .pedido-itens li {
            padding: 6px 0;
            border-bottom: 1px dashed #333;
            font-size: 1.1em;
        }

        .btn-concluir {
            background-color: #008744;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-concluir:hover {
            background-color: #006633;
        }

        .sem-pedidos {
            grid-column: 1 / -1;
            text-align: center;
            color: #666;
            font-size: 1.5em;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ecrã de Produção - Cozinha</h1>
        <div style="font-size: 0.9em; color: #fff;">Atualização Automática Ativa</div>
    </header>

    <div class="painel-pedidos" id="painel-pedidos">
        <!-- Os pedidos vão aparecer aqui via JavaScript -->
    </div>

    <script>
        function carregarPedidos() {
            const painel = document.getElementById('painel-pedidos');
            const pedidos = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];

            if (pedidos.length === 0) {
                painel.innerHTML = '<div class="sem-pedidos">Nenhum pedido pendente de momento.</div>';
                return;
            }

            painel.innerHTML = '';

            pedidos.forEach((pedido, index) => {
                // Conta a quantidade de cada item no pedido
                const contagemItens = {};
                pedido.itens.forEach(item => {
                    contagemItens[item] = (contagemItens[item] || 0) + 1;
                });

                // Cria a lista de itens em HTML
                let listaHTML = '';
                for (const [item, qtd] of Object.entries(contagemItens)) {
                    listaHTML += `<li>${qtd}x ${item}</li>`;
                }

                // Estrutura do cartão do pedido
                const card = document.createElement('div');
                card.className = 'pedido-card';
                card.innerHTML = `
                    <div>
                        <div class="pedido-header">
                            <span class="pedido-id">PEDIDO #${pedido.id}</span>
                            <span class="pedido-hora">${pedido.hora}</span>
                        </div>
                        <ul class="pedido-itens">
                            ${listaHTML}
                        </ul>
                    </div>
                    <button class="btn-concluir" onclick="concluirPedido(${index})">Concluir / Entregar</button>
                `;
                
                painel.appendChild(card);
            });
        }

        function concluirPedido(index) {
            let pedidos = JSON.parse(localStorage.getItem('pedidosCozinha')) || [];
            // Remove o pedido selecionado da lista
            pedidos.splice(index, 1);
            localStorage.setItem('pedidosCozinha', JSON.stringify(pedidos));
            // Recarrega o ecrã imediatamente
            carregarPedidos();
        }

        // Verifica novos pedidos a cada 1 segundo (atualização em tempo real)
        setInterval(carregarPedidos, 1000);

        // Carrega os pedidos ao abrir a página
        window.onload = carregarPedidos;
    </script>
</body>
</html>
