<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacFilipe</title>
<style>
:root{color-scheme:light;--bg:#fff6dc;--card:#fffdf6;--ink:#2b1a14;--mute:#7a6558;--red:#d62718;--yel:#ffc72c;--line:#ecd9a8;--ok:#1c8a4a;--top:#d62718;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:130px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:10}
header{background:var(--top);color:#fff;padding:14px 20px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.logo b{font-size:1.9rem;letter-spacing:-.5px;color:var(--yel);font-family:Georgia,"Times New Roman",serif;font-style:italic}
.logo span{font-size:.9rem;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;max-width:170px;white-space:nowrap;border:0;background:rgba(0,0,0,.18);color:#fff;font:inherit;font-weight:700;padding:10px 8px;border-radius:10px 10px 0 0;cursor:pointer}
nav button[aria-selected="true"]{background:var(--bg);color:var(--red)}
nav button:focus-visible,.btn:focus-visible,.cat:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:20px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.cat{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--yel);border-color:var(--yel);color:#2b1a14}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:center}
.item .e{font-size:3.2rem;line-height:1.1}
.item h3{margin:0;font-size:1.1rem}
.item p{margin:0;font-size:.85rem;color:var(--mute);min-height:2.6em}
.item .pr{font-weight:800;color:var(--red);font-size:1.15rem}
.btn{border:0;background:var(--yel);color:#2b1a14;font:inherit;font-weight:800;padding:11px 18px;border-radius:999px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.cart{position:fixed;left:0;right:0;bottom:0;background:#2b1a14;color:#fff1d6;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.cart-in{max-width:1000px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between}
.lines{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 6px 4px 12px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.chip button{border:0;background:rgba(255,255,255,.2);color:inherit;width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:800}
.tot{font-size:1.25rem;font-weight:800;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:50px 0;font-size:1.2rem;grid-column:1/-1}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tk{background:var(--card);border:3px solid var(--yel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tk.late{border-color:var(--red)}
.tk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:8px}
.tk-h b{font-size:1.4rem;color:var(--red)}
.tk-h span{color:var(--mute);font-size:.9rem}
.tk ul{list-style:none;margin:0;padding:0;flex:1}
.tk li{padding:5px 0;font-size:1.1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols h2{margin:0 0 12px;font-size:1.3rem}
.nums{display:flex;flex-wrap:wrap;gap:10px}
.num{font-size:2.4rem;font-weight:900;border-radius:14px;padding:6px 18px;background:var(--card);border:3px solid var(--line);font-variant-numeric:tabular-nums}
.num.rdy{background:var(--ok);border-color:var(--ok);color:#fff;cursor:pointer;font-family:inherit}
.hint{color:var(--mute);font-size:.85rem;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:14px 24px;border-radius:14px;font-weight:800;font-size:1.1rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.item.out{opacity:.55}.item.out .pr{color:var(--mute)}
.acc{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.9rem}.acc .btn{padding:6px 14px}
.fld{width:100%;font:inherit;font-size:1.05rem;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:0 0 8px}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.btn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.ovl.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:440px;text-align:center}
.modal h2{margin:0 0 6px;color:var(--red)}
.pays{display:flex;gap:12px;margin:16px 0}
.pay{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;border-radius:12px;padding:14px;cursor:pointer}
.pay span{display:block;font-size:1.8rem}
.pay[aria-pressed="true"]{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.flow{display:none;margin:12px 0;padding:14px;border:2px dashed var(--line);border-radius:12px}
.flow input{width:100%;font:inherit;font-size:1.1rem;text-align:center;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.stat{font-weight:700;margin-top:8px}
.kwrap{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.stock{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px}
.stock h2{margin:0 0 8px;font-size:1.1rem}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;font-size:.95rem}
.sw input{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
.map-box{width:100%;height:180px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.hint a{color:var(--red);font-weight:700}
@media(max-width:700px){.kwrap{grid-template-columns:1fr}}
@media(max-width:560px){.cols{grid-template-columns:1fr}.cart-in{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>MacFilipe</b><span>Pedidos em tempo real</span><div class="acc" id="acc"></div></div>
  <nav role="tablist">
    <button role="tab" id="t-kiosk" onclick="go('kiosk')">Quiosque</button>
    <button role="tab" id="t-cozinha" onclick="go('cozinha')">Cozinha</button>
    <button role="tab" id="t-balcao" onclick="go('balcao')">Balcão</button>
    <button role="tab" id="t-conta" onclick="go('conta')">A minha conta</button>
    <button role="tab" id="t-admin" onclick="go('admin')">Admin</button>
  </nav>
</header>
<main id="app"></main>
<div class="cart" id="cart"></div>
<div class="ovl" id="pay"><div class="modal" role="dialog" aria-label="Pagamento"><h2>Pagamento</h2><p><b>Como quer receber?</b></p>
<div class="pays"><button class="pay" id="e-aqui" aria-pressed="true" onclick="modo('aqui')">Comer aqui</button><button class="pay" id="e-levar" aria-pressed="false" onclick="modo('levar')">Para levar</button><button class="pay" id="e-ent" aria-pressed="false" onclick="modo('ent')">Entrega</button></div>
<div id="f-ent" style="display:none"><div class="map-box"><iframe id="mapf" title="Mapa da morada de entrega" width="100%" height="100%" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div><p class="hint" style="margin:-6px 0 10px"><a id="maplink" href="#" target="_blank" rel="noopener">Abrir no Google Maps</a></p><input class="fld" id="en-mor" placeholder="Morada (rua, n.º, andar)" autocomplete="street-address" value="Estrada dos Luízes, n.º 17" onchange="mapa()"><input class="fld" id="en-cp" placeholder="Código postal (0000-000)" maxlength="8" inputmode="numeric" autocomplete="postal-code" value="2070-388" onchange="mapa()"><input class="fld" id="en-tel" type="tel" placeholder="Telemóvel para contacto" maxlength="9" autocomplete="tel"><p class="err" id="en-e" role="alert"></p></div>
<p class="stat" id="resumo"></p>
<p>Escolha como quer pagar.</p>
<div class="pays"><button class="pay" id="b-card" aria-pressed="false" onclick="pick('card')"><span>💳</span>Cartão / MB</button><button class="pay" id="b-mb" aria-pressed="false" onclick="pick('mb')"><span>📱</span>MB WAY</button></div>
<div class="flow" id="f-card"><p>Insira ou aproxime o cartão no terminal.</p><div class="stat" id="st-card"></div></div>
<div class="flow" id="f-mb"><p>Número de telemóvel MB WAY:</p><input id="mbp" type="tel" inputmode="numeric" maxlength="9" placeholder="9xxxxxxxx"><button class="btn red" onclick="mbway()">Confirmar</button><div class="stat" id="st-mb"></div></div>
<button class="btn ghost" onclick="closePay()">Cancelar</button></div></div>
<div class="ovl" id="auth"><div class="modal" role="dialog" aria-label="Conta"><h2>A sua conta</h2>
<div class="pays"><button class="pay" id="a-in" aria-pressed="true" onclick="authMode('in')">Entrar</button><button class="pay" id="a-up" aria-pressed="false" onclick="authMode('up')">Registar</button></div>
<input class="fld" id="au-nome" placeholder="Nome" style="display:none" autocomplete="name">
<input class="fld" id="au-u" placeholder="Utilizador" autocomplete="username" autocapitalize="none">
<input class="fld" id="au-p" type="password" placeholder="Chave de acesso" autocomplete="current-password" onkeydown="if(event.key==='Enter')authGo()">
<p class="err" id="au-e" role="alert"></p>
<button class="btn red" id="au-go" onclick="authGo()">Entrar</button> <button class="btn ghost" onclick="closeAuth()">Cancelar</button></div></div>

<script>
const MENU=[
 {c:'Hambúrgueres',e:'🍔',n:'Big Filipe',d:'Dois hambúrgueres de vaca, alface, queijo, pepino e molho da casa.',p:5.9},
 {c:'Hambúrgueres',e:'🍗',n:'Crocante de Frango',d:'Frango panado com alface e maionese.',p:4.9},
 {c:'Hambúrgueres',e:'🧀',n:'Cheeseburger',d:'Vaca grelhada, queijo derretido, ketchup e mostarda.',p:2.6},
 {c:'Acompanhamentos',e:'🍟',n:'Batatas Fritas',d:'Douradas e estaladiças por fora.',p:2.5},
 {c:'Acompanhamentos',e:'🍗',n:'Nuggets (6)',d:'Seis nuggets de frango com molho à escolha.',p:3.8},
 {c:'Bebidas',e:'🥤',n:'Refrigerante',d:'Cola, laranja ou limão. 40 cl.',p:2.2},
 {c:'Bebidas',e:'🥛',n:'Batido de Morango',d:'Cremoso, com pedaços de fruta.',p:2.9},
 {c:'Bebidas',e:'☕',n:'Café',d:'Expresso, curto ou cheio.',p:1.0},
 {c:'Sobremesas',e:'🍦',n:'Sundae de Chocolate',d:'Gelado de baunilha com calda quente de chocolate.',p:2.4},
 {c:'Sobremesas',e:'🥧',n:'Tarte de Maçã',d:'Quentinha, com recheio de maçã e canela.',p:1.9}
];
const CATS=[...new Set(MENU.map(m=>m.c))];
const K='mf_orders',N='mf_n';
let mem=[],memN=100,cart={},cat=CATS[0],view='kiosk';

const eur=v=>v.toFixed(2).replace('.',',')+' €';
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return mem}}
function save(o){mem=o;try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
function nextN(){let n=memN;try{n=+localStorage.getItem(N)||100}catch(e){}n++;memN=n;try{localStorage.setItem(N,n)}catch(e){}return n}
const price=n=>MENU.find(m=>m.n===n).p;
let memOut={};
const out=()=>{try{return JSON.parse(localStorage.getItem('mf_out'))||{}}catch(e){return memOut}};
function toggle(n){const o=out();o[n]?delete o[n]:o[n]=1;memOut=o;try{localStorage.setItem('mf_out',JSON.stringify(o))}catch(e){}}
const total=()=>Object.entries(cart).reduce((s,[n,q])=>s+price(n)*q,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);

function go(v){view=v;try{history.replaceState(null,'',v==='kiosk'?'#':'#'+v)}catch(e){}render()}
function render(){
  const s=me(),adm=s&&s.role==='admin';
  if(!adm&&(view==='cozinha'||view==='admin')){view='kiosk';openAuth()}
  for(const v of ['kiosk','cozinha','balcao','conta','admin']){const b=$('t-'+v);b.setAttribute('aria-selected',v===view);if(v==='cozinha'||v==='admin')b.style.display=adm?'':'none'}
  drawAcc();
  $('cart').style.display=view==='kiosk'?'block':'none';
  if(view==='kiosk'){drawKiosk();drawCart()}
  else if(view==='cozinha')drawCozinha();
  else if(view==='conta')drawConta();
  else if(view==='admin')drawAdmin();
  else drawBalcao();
}

/* Quiosque */
function drawKiosk(){
  $('app').innerHTML=
   '<div class="cats">'+CATS.map(c=>`<button class="cat" aria-pressed="${c===cat}" onclick="setCat('${c}')">${c}</button>`).join('')+'</div>'+
   '<div class="grid">'+MENU.filter(m=>m.c===cat).map(m=>
     `<div class="item ${out()[m.n]?'out':''}"><div class="e">${m.e}</div><h3>${m.n}</h3><p>${m.d}</p><div class="pr">${out()[m.n]?'Esgotado':eur(m.p)}</div><button class="btn" ${out()[m.n]?'disabled':''} onclick="add('${m.n}')">${out()[m.n]?'Indisponível':'Adicionar'}</button></div>`).join('')+'</div>';
}
function setCat(c){cat=c;drawKiosk()}
function add(n){cart[n]=(cart[n]||0)+1;drawCart()}
function sub(n){if(--cart[n]<=0)delete cart[n];drawCart()}
function drawCart(){
  const l=Object.entries(cart);
  $('cart').innerHTML=`<div class="cart-in"><div class="lines">${l.length?l.map(([n,q])=>`<span class="chip">${q}× ${n}<button aria-label="Remover ${n}" onclick="sub('${n}')">−</button></span>`).join(''):'<span style="opacity:.7">O carrinho está vazio. Escolha um item para começar.</span>'}</div>
  <div class="tot">${eur(total())}</div>
  <button class="btn" ${l.length?'':'disabled style="opacity:.5"'} onclick="openPay()">Proceder ao pagamento</button></div>`;
}
function checkout(){
  if(!count())return;
  const s=me(),o={id:nextN(),itens:{...cart},total:total()+taxa(),t:Date.now(),s:'prep',u:s?s.user:'',e:mod,mor:mod==='ent'?$('en-mor').value.trim()+', '+$('en-cp').value.trim()+' · tel. '+$('en-tel').value:''};
  const all=load();all.push(o);save(all);
  if(s){const us=users();us[s.user].pts+=Math.floor(o.total);saveU(us)}
  cart={};drawCart();
  const t=document.createElement('div');t.className='toast';t.textContent='Pedido #'+o.id+' enviado para a cozinha';
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

/* Contas */
const U='mf_users',S='mf_sess',ST={prep:'A preparar',rdy:'Pronto',done:'Entregue'};
let memU={},memS=null,authM='in';
const esc=t=>String(t).replace(/[&<>]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':'&gt;');
function users(){try{return JSON.parse(localStorage.getItem(U))||{}}catch(e){return memU}}
function saveU(u){memU=u;try{localStorage.setItem(U,JSON.stringify(u))}catch(e){}}
function setSess(n){memS=n;try{n?localStorage.setItem(S,n):localStorage.removeItem(S)}catch(e){}}
function me(){let n=memS;try{n=localStorage.getItem(S)}catch(e){}const u=users();return n&&Object.keys(u).includes(n)?{...u[n],user:n}:null}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mf:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+p}}
async function seed(){const u=users();if(!u.admin){u.admin={h:await hash('admin'),nome:'Administrador',role:'admin',pts:0};saveU(u)}}
function authMode(m){authM=m;$('a-in').setAttribute('aria-pressed',m==='in');$('a-up').setAttribute('aria-pressed',m==='up');$('au-nome').style.display=m==='up'?'block':'none';$('au-go').textContent=m==='up'?'Criar conta':'Entrar';$('au-e').textContent=''}
function openAuth(){authMode('in');$('auth').classList.add('on');$('au-u').focus()}
function closeAuth(){$('auth').classList.remove('on');$('au-p').value=''}
async function authGo(){
  const u=$('au-u').value.trim().toLowerCase(),p=$('au-p').value,all=users(),err=$('au-e');
  if(!u||!p){err.textContent='Preencha o utilizador e a chave de acesso.';return}
  if(authM==='up'){
    if(!/^[a-z0-9_.-]{3,20}$/.test(u)){err.textContent='Utilizador: 3 a 20 caracteres (letras, números, _ . -).';return}
    if(Object.keys(all).includes(u)){err.textContent='Esse utilizador já existe.';return}
    if(p.length<4){err.textContent='A chave de acesso precisa de pelo menos 4 caracteres.';return}
    all[u]={h:await hash(p),nome:$('au-nome').value.trim()||u,role:'cliente',pts:0};saveU(all);
  }else if(!Object.keys(all).includes(u)||all[u].h!==await hash(p)){err.textContent='Utilizador ou chave de acesso incorretos.';return}
  setSess(u);closeAuth();render();
}
function logout(){setSess(null);view='kiosk';render()}
function drawAcc(){const s=me();$('acc').innerHTML=s?`<span>Olá, ${esc(s.nome)}${s.role==='admin'?' (admin)':''}</span><button class="btn" onclick="logout()">Sair</button>`:'<button class="btn" onclick="openAuth()">Entrar / Registar</button>'}
function drawConta(){
  const s=me();
  if(!s){$('app').innerHTML='<div class="empty">Entre na sua conta para ver os seus pedidos e pontos.<br><br><button class="btn red" onclick="openAuth()">Entrar / Registar</button></div>';return}
  const os=load().filter(o=>o.u===s.user).reverse();
  $('app').innerHTML=`<div class="stock" style="margin-bottom:16px"><h2>${esc(s.nome)} <small style="color:var(--mute)">@${esc(s.user)}</small></h2><p style="font-size:2rem;margin:6px 0;font-weight:900;color:var(--red)">${s.pts} pontos</p><p class="hint">Ganha 1 ponto por cada euro gasto.</p></div><h2>Os meus pedidos</h2><div class="kgrid">`+(os.length?os.map(o=>`<div class="tk"><div class="tk-h"><b>#${o.id}</b><span>${eur(o.total)} · ${MODO[o.e||'aqui']} · ${ST[o.s]}</span></div><ul>${Object.entries(o.itens).map(([n,q])=>`<li>${q}× ${n}</li>`).join('')}</ul></div>`).join(''):'<div class="empty">Ainda não fez pedidos.</div>')+'</div>';
}
function drawAdmin(){
  const us=users(),os=load();
  $('app').innerHTML=`<div class="kgrid" style="margin-bottom:20px"><div class="tk"><div class="tk-h"><b>${os.length}</b><span>pedidos</span></div></div><div class="tk"><div class="tk-h"><b>${eur(os.reduce((a,o)=>a+o.total,0))}</b><span>faturado</span></div></div><div class="tk"><div class="tk-h"><b>${Object.keys(us).length}</b><span>contas</span></div></div></div><h2>Contas</h2><div class="stock" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:460px">`+Object.entries(us).map(([k,u])=>`<tr><td>${k}</td><td>${esc(u.nome)}</td><td>${u.role}</td><td>${u.pts} pts</td><td>${k==='admin'?'':`<button class="btn ghost" onclick="setRole('${k}')">${u.role==='admin'?'Tirar admin':'Tornar admin'}</button> <button class="btn ghost" onclick="delU('${k}')">Apagar</button>`}</td></tr>`).join('')+'</table></div><p><button class="btn ghost" onclick="save([]);render()">Limpar histórico de pedidos</button></p>';
}
function setRole(k){const u=users();u[k].role=u[k].role==='admin'?'cliente':'admin';saveU(u);render()}
function delU(k){const u=users();delete u[k];saveU(u);render()}

/* Pagamento */
let tm=[],mod='aqui';
const TAXA=1.5,MODO={aqui:'Comer aqui',levar:'Para levar',ent:'Entrega'};
const taxa=()=>mod==='ent'?TAXA:0;
function openPay(){if(count()){modo(mod);$('pay').classList.add('on')}}
function modo(m){mod=m;for(const k of ['aqui','levar','ent'])$('e-'+k).setAttribute('aria-pressed',k===m);$('f-ent').style.display=m==='ent'?'block':'none';if(m==='ent')mapa();$('en-e').textContent='';$('resumo').textContent='Total: '+eur(total()+taxa())+(m==='ent'?' (inclui entrega de '+eur(TAXA)+')':'')}
function mapa(){
  const q=encodeURIComponent($('en-mor').value+', '+$('en-cp').value+', Portugal'),f=$('mapf');
  $('maplink').href='https://www.google.com/maps/search/?api=1&query='+q;
  if(f.dataset.q===q)return;f.dataset.q=q;f.src='https://www.google.com/maps?q='+q+'&output=embed';
}
function okEnt(){
  if(mod!=='ent')return true;const e=$('en-e');
  if($('en-mor').value.trim().length<5){e.textContent='Indique a morada de entrega.';return false}
  if(!/^\d{4}-\d{3}$/.test($('en-cp').value.trim())){e.textContent='Código postal inválido (formato 0000-000).';return false}
  if(!/^9\d{8}$/.test($('en-tel').value)){e.textContent='Indique um telemóvel válido (9 dígitos, começado por 9).';return false}
  e.textContent='';return true
}
function closePay(){tm.forEach(clearTimeout);tm=[];$('pay').classList.remove('on');$('f-card').style.display=$('f-mb').style.display='none';$('mbp').value='';$('st-mb').textContent='';$('b-card').setAttribute('aria-pressed','false');$('b-mb').setAttribute('aria-pressed','false')}
function pick(m){
  if(!okEnt())return;
  tm.forEach(clearTimeout);tm=[];
  $('f-card').style.display=m==='card'?'block':'none';
  $('f-mb').style.display=m==='mb'?'block':'none';
  $('b-card').setAttribute('aria-pressed',m==='card');$('b-mb').setAttribute('aria-pressed',m==='mb');
  if(m==='card'){$('st-card').textContent='A ler cartão…';
    tm.push(setTimeout(()=>{$('st-card').textContent='Pago com sucesso! A emitir talão…';tm.push(setTimeout(paid,1500))},3000))}
}
function mbway(){
  if(!okEnt())return;
  const p=$('mbp').value;
  if(!/^9\d{8}$/.test(p)){$('st-mb').textContent='Introduza um número válido: 9 dígitos, começado por 9.';return}
  $('st-mb').textContent='Notificação enviada para o '+p+'. Abra a app MB WAY para aceitar…';
  tm.push(setTimeout(()=>{$('st-mb').textContent='Pagamento MB WAY autorizado!';tm.push(setTimeout(paid,1500))},4000));
}
function paid(){closePay();checkout();mod='aqui';$('en-tel').value=''}

/* Cozinha */
function drawCozinha(){
  const os=load().filter(o=>o.s==='prep');
  if(!$('ord'))$('app').innerHTML='<div class="kwrap"><aside class="stock"><h2>Disponibilidade do quiosque</h2>'+MENU.map(m=>`<label class="sw"><span>${m.e} ${m.n}</span><input type="checkbox" aria-label="${m.n} disponível" ${out()[m.n]?'':'checked'} onchange="toggle('${m.n}')"></label>`).join('')+'</aside><div id="ord"></div></div>';
  $('ord').innerHTML='<div class="kgrid">'+(os.length?os.map(o=>{
    const min=Math.floor((Date.now()-o.t)/60000);
    return `<div class="tk ${min>=5?'late':''}"><div class="tk-h"><b>Pedido #${o.id}</b><span>${new Date(o.t).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})} · há ${min} min</span></div>
    <div class="stat">${MODO[o.e||'aqui']}${o.mor?': '+esc(o.mor):''}</div>
    <ul>${Object.entries(o.itens).map(([n,q])=>`<li>${q}× ${n}</li>`).join('')}</ul>
    <button class="btn ok" onclick="setS(${o.id},'rdy')">Pronto</button></div>`}).join(''):'<div class="empty">Sem pedidos por preparar.</div>')+'</div>';
}
function setS(id,s){
  let all=load();
  all=all.map(o=>o.id===id?{...o,s}:o);
  save(all);render();
}

/* Balcão */
function drawBalcao(){
  const all=load(),p=all.filter(o=>o.s==='prep'),r=all.filter(o=>o.s==='rdy');
  const chips=(a,c)=>a.length?a.map(o=>c?`<button class="num rdy" onclick="setS(${o.id},'done')" aria-label="Entregar pedido ${o.id}">${o.id}${o.e==='ent'?' 🛵':''}</button>`:`<div class="num">${o.id}${o.e==='ent'?' 🛵':''}</div>`).join(''):'<span style="color:var(--mute)">Nenhum</span>';
  $('app').innerHTML=`<div class="cols"><section><h2>A preparar</h2><div class="nums">${chips(p,0)}</div></section><section><h2>Pronto para levantar</h2><div class="nums">${chips(r,1)}</div><p class="hint">Toque no número quando o cliente levantar o pedido.</p></section></div>`;
}

addEventListener('storage',()=>{if(view!=='kiosk')render();else{drawKiosk();drawAcc()}});
setInterval(()=>{if(view!=='kiosk')render()},1500);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);view=['cozinha','balcao','conta','admin'].includes(h)?h:'kiosk';render()});
{const h=location.hash.slice(1);if(['cozinha','balcao','conta','admin'].includes(h))view=h}
render();seed().then(render);
</script>
