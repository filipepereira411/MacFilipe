<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacFilipe (Supabase)</title>
<style>
:root{color-scheme:light;--bg:#fff6dc;--card:#fffdf6;--ink:#2b1a14;--mute:#7a6558;--red:#d62718;--yel:#ffc72c;--line:#ecd9a8;--ok:#1c8a4a;--top:#d62718;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1210;--card:#2a1c17;--ink:#fff1d6;--mute:#b79f8c;--line:#47332b;--ok:#3fbf75}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:130px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top);z-index:10}
header{background:var(--top);color:#fff;padding:14px 20px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.logo b{font-size:1.9rem;letter-spacing:-.5px;color:var(--yel);font-family:Georgia,"Times New Roman",serif;font-style:italic}
.logo span{font-size:.9rem;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;max-width:170px;white-space:nowrap;border:0;background:rgba(0,0,0,.18);color:#fff;font:inherit;font-weight:700;padding:10px 8px;border-radius:10px 10px 0 0;cursor:pointer}
nav button[aria-selected="true"]{background:var(--bg);color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:center}
.item .e{font-size:3.2rem;line-height:1.1}
.item h3{margin:0;font-size:1.1rem}
.item p{margin:0;font-size:.85rem;color:var(--mute);min-height:2.6em}
.item .pr{font-weight:800;color:var(--red);font-size:1.15rem}
.btn{border:0;background:var(--yel);color:#2b1a14;font:inherit;font-weight:800;padding:11px 18px;border-radius:999px;cursor:pointer}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tk{background:var(--card);border:3px solid var(--yel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:8px}
.tk-h b{font-size:1.4rem;color:var(--red)}
.tk ul{list-style:none;margin:0;padding:0;flex:1}
.tk li{padding:5px 0;font-size:1.1rem}
.nums{display:flex;flex-wrap:wrap;gap:10px}
.num{font-size:2.4rem;font-weight:900;border-radius:14px;padding:6px 18px;background:var(--card);border:3px solid var(--line)}
.num.rdy{background:var(--ok);border-color:var(--ok);color:#fff;cursor:pointer}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:0 0 8px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.ovl.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:440px;text-align:center}
.pays{display:flex;gap:12px;margin:16px 0}
.pay{flex:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;border-radius:12px;padding:14px;cursor:pointer}
.pay[aria-pressed="true"]{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.fld{width:100%;font:inherit;font-size:1.05rem;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
</style>

<!-- Inclusão do SDK do Supabase -->
<script src="https://jsdelivr.net"></script>
</head>
<body>

<header>
  <div class="logo"><b>MacFilipe</b><span>Pedidos em tempo real (Supabase)</span></div>
  <nav role="tablist">
    <button role="tab" id="t-kiosk" aria-selected="true" onclick="go('kiosk')">Quiosque</button>
    <button role="tab" id="t-cozinha" aria-selected="false" onclick="go('cozinha')">Cozinha</button>
    <button role="tab" id="t-balcao" aria-selected="false" onclick="go('balcao')">Balcão</button>
  </nav>
</header>

<main id="app"></main>

<!-- MODAL DE PAGAMENTO -->
<div class="ovl" id="pay">
  <div class="modal" role="dialog">
    <h2>Pagamento</h2>
    <p><b>Como quer receber?</b></p>
    <div class="pays">
      <button class="pay" id="e-aqui" aria-pressed="true" onclick="modo('aqui')">Comer aqui</button>
      <button class="pay" id="e-levar" aria-pressed="false" onclick="modo('levar')">Para levar</button>
      <button class="pay" id="e-entrega" aria-pressed="false" onclick="modo('entrega')">Entrega</button>
    </div>
    
    <div>
      <input type="text" id="p-nome" class="fld" placeholder="Nome" value="TimeCity">
      <input type="text" id="p-cp" class="fld" placeholder="Código Postal (0000-000)" value="2070-388">
      <input type="text" id="p-tel" class="fld" placeholder="Telemóvel" value="928037083">
      <div class="err" id="p-err"></div>
    </div>

    <p id="p-total">Total: 4,10 € (inclui entrega de 1,50 €)</p>

    <div class="pays">
      <button class="btn ghost" style="flex:1;" onclick="concluirPagamento('Cartão / MB')">💳 Cartão / MB</button>
      <button class="btn" style="flex:1; background:var(--yel);" onclick="concluirPagamento('MB WAY')">📱 MB WAY</button>
    </div>
    <br><br>
    <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
  // Chaves do seu projeto carregadas com sucesso!
  const SUPABASE_URL = "https://supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_IL4ydy_AzNy30aVW7qdFDg_dwfMhcux"; 

  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let modoAtual = 'aqui';

  window.go = function(ecra) {
    ['kiosk', 'cozinha', 'balcao'].forEach(t => {
      document.getElementById(`t-${t}`).setAttribute('aria-selected', t === ecra ? 'true' : 'false');
    });

    const main = document.getElementById('app');
    if (ecra === 'kiosk') {
      main.innerHTML = `
        <h2>Menu Quiosque</h2>
        <div class="grid">
          <div class="item">
            <span class="e">🍔</span>
            <h3>Menu McFilipe</h3>
            <p>Hambúrguer premium com batatas e bebida.</p>
            <span class="pr">4,10 €</span>
            <button class="btn" onclick="abrirPagamento()">Pedir Agora</button>
          </div>
        </div>`;
    } else if (ecra === 'cozinha') {
      main.innerHTML = `<h2>Painel da Cozinha</h2><div class="kgrid" id="lista-cozinha"></div>`;
      carregarPedidos();
    } else if (ecra === 'balcao') {
      main.innerHTML = `<h2>Pedidos para Levantar</h2><div class="nums" id="lista-balcao"></div>`;
      carregarPedidos();
    }
  };

  window.abrirPagamento = function() { document.getElementById('pay').classList.add('on'); };
  window.fecharModal = function() { document.getElementById('pay').classList.remove('on'); };

  window.modo = function(tipo) {
    modoAtual = tipo;
    ['aqui', 'levar', 'entrega'].forEach(m => {
      document.getElementById(`e-${m}`).setAttribute('aria-pressed', m === tipo ? 'true' : 'false');
    });
    document.getElementById('p-total').innerText = tipo === 'entrega' ? "Total: 4,10 € (inclui entrega de 1,50 €)" : "Total: 2,60 €";
  };

  window.concluirPagamento = async function(metodo) {
    const nome = document.getElementById('p-nome').value;
    const cp = document.getElementById('p-cp').value;
    const tel = document.getElementById('p-tel').value;

    if (modoAtual === 'entrega' && !/^\d{4}-\d{3}$/.test(cp)) {
      document.getElementById('p-err').innerText = "Código postal inválido (formato 0000-000).";
      return;
    }

    const { error } = await _supabase.from('pedidos').insert([{
      cliente: nome,
      metodo_pagamento: metodo,
      modo_recebimento: modoAtual,
      codigo_postal: modoAtual === 'entrega' ? cp : '',
      telemovel: tel,
      total: modoAtual === 'entrega' ? 4.10 : 2.60,
      estado: 'pendente'
    }]);

    if (error) {
      alert("Erro ao enviar: " + error.message);
    } else {
      alert("Pedido enviado com sucesso!");
      fecharModal();
    }
  };

  async function carregarPedidos() {
    const { data: pedidos } = await _supabase.from('pedidos').select('*').order('id', { ascending: true });
    if (!pedidos) return;

    const divCozinha = document.getElementById('lista-cozinha');
    if (divCozinha) {
      let html = '';
      pedidos.filter(p => p.estado === 'pendente').forEach(p => {
        html += `
          <div class="tk">
            <div class="tk-h"><b>#${p.id}</b> <span>${p.modo_recebimento}</span></div>
            <ul><li>1x Menu McFilipe</li></ul>
            <button class="btn ok" onclick="mudarEstado(${p.id}, 'pronto')">Pronto</button>
          </div>`;
      });
      divCozinha.innerHTML = html || '<p>Nenhum pedido pendente.</p>';
    }

    const divBalcao = document.getElementById('lista-balcao');
    if (divBalcao) {
      let html = '';
      pedidos.filter(p => p.estado === 'pronto').forEach(p => {
        html += `<button class="num rdy" onclick="mudarEstado(${p.id}, 'entregue')">#${p.id}</button>`;
      });
      divBalcao.innerHTML = html;
    }
  }

  window.mudarEstado = async function(id, novoEstado) {
    await _supabase.from('pedidos').update({ estado: novoEstado }).eq('id', id);
    carregarPedidos();
  };

  // Escuta as atualizações automáticas das tabelas em tempo real
  _supabase.channel('custom-all-channel')
